name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: release
        run: |
          TAG=$(node app/scripts/release-publication.js)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.validate-release.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish tag and GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to a different commit." >&2
              exit 1
            fi
            TARGET_ARGS=()
          else
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" "${TARGET_ARGS[@]}" --generate-notes --title "$TAG"
